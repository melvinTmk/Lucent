<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#241856"/>
      <stop offset="0.6" stop-color="#110f36"/>
      <stop offset="1" stop-color="#080a1e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.62" r="0.62">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.3" stop-color="#ffd98a"/>
      <stop offset="0.62" stop-color="#ff8a5c"/>
      <stop offset="1" stop-color="#d23c8e"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a6b" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#b03ad1" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6a3cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a5c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur-big" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="blur-glass" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="blur-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="shadow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="230"/></clipPath>
    <!-- Horizon at y=700: the sun only shows above it -->
    <clipPath id="sky"><rect width="1024" height="700"/></clipPath>
    <clipPath id="dock"><rect x="172" y="636" width="680" height="128" rx="64"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="512" cy="660" r="420" fill="url(#halo)" filter="url(#blur-big)"/>
    <!-- Rising sun -->
    <circle cx="512" cy="700" r="270" fill="url(#sun)" clip-path="url(#sky)"/>
    <!-- Water below the horizon, with the sun's reflection -->
    <rect x="0" y="700" width="1024" height="324" fill="#080a1e" opacity="0.7"/>
    <g filter="url(#blur-soft)">
      <rect x="352" y="784" width="320" height="14" rx="7" fill="url(#reflect)"/>
      <rect x="402" y="822" width="220" height="12" rx="6" fill="url(#reflect)" opacity="0.7"/>
      <rect x="452" y="856" width="120" height="10" rx="5" fill="url(#reflect)" opacity="0.5"/>
    </g>

    <!-- Glass dock on the horizon -->
    <g filter="url(#shadow)">
      <g clip-path="url(#dock)">
        <rect x="172" y="636" width="680" height="128" fill="#131a40" opacity="0.6"/>
        <circle cx="512" cy="700" r="285" fill="url(#sun)" clip-path="url(#sky)" filter="url(#blur-glass)" opacity="0.95"/>
        <rect x="172" y="636" width="680" height="128" fill="url(#glass)"/>
        <rect x="240" y="645" width="544" height="8" rx="4" fill="url(#sheen)"/>
      </g>
      <rect x="173.5" y="637.5" width="677" height="125" rx="62.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
    </g>
    <circle cx="392" cy="700" r="22" fill="#ffffff" opacity="0.95"/>
    <circle cx="512" cy="700" r="22" fill="#ffffff" opacity="0.95"/>
    <circle cx="632" cy="700" r="22" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
